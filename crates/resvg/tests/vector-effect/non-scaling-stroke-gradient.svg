<svg id="svg1" viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg">
    <title>Non-scaling stroke with a gradient</title>

    <defs>
        <linearGradient id="grad1" gradientUnits="userSpaceOnUse" x1="10" y1="20" x2="60" y2="20">
            <stop id="stop1" offset="0" stop-color="#ff0000"/>
            <stop id="stop2" offset="1" stop-color="#0000ff"/>
        </linearGradient>
    </defs>

    <g id="g1" transform="scale(2)">
        <line id="line1" x1="10" y1="20" x2="60" y2="20" stroke="url(#grad1)" stroke-width="6"
              vector-effect="non-scaling-stroke"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="158" height="78" fill="none" stroke="black"/>
</svg>
