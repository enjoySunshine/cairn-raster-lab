<svg id="svg1" width="200" height="100" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
    <title>Non-scaling stroke under a scaled viewBox</title>

    <rect id="rect1" x="20" y="10" width="40" height="20" fill="#f4c542" stroke="#142033"
          stroke-width="4" vector-effect="non-scaling-stroke"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="98" height="48" fill="none" stroke="black"/>
</svg>
