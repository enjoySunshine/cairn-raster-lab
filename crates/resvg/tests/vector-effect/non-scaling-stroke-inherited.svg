<svg id="svg1" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
    <title>Non-scaling stroke is not inherited from a group</title>

    <g id="g1" transform="translate(20 20) scale(3 1)" vector-effect="non-scaling-stroke">
        <rect id="rect1" x="10" y="10" width="20" height="30" fill="#e23b2f" stroke="#142033"
              stroke-width="8"/>
        <rect id="rect2" x="40" y="10" width="20" height="30" fill="#e23b2f" stroke="#142033"
              stroke-width="8" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="318" height="98" fill="none" stroke="black"/>
</svg>
